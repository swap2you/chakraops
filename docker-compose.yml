# R24.8/R24.9: Docker packaging and internet-safe deployment.
# Dev (default): docker compose up --build  → frontend :18873, backend :18800 (host)
# Prod:          docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile prod up -d --build
#               → only Caddy :80/:443; backend and frontend internal. Same-origin /api via Caddy.

services:
  backend:
    build:
      context: .
      dockerfile: chakraops/Dockerfile
    restart: unless-stopped
    ports:
      - "18800:8000"
    volumes:
      - ./out:/workspace/out
      # R26.6: persist data/ (journal, checklists, monthly reports)
      - ./data:/workspace/chakraops/data
    env_file:
      - .env
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # In prod, use docker-compose.prod.yml to remove ports (backend not exposed to host).

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: "http://127.0.0.1:18800"
    restart: unless-stopped
    ports:
      - "18873:80"
    depends_on:
      - backend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # In prod, use docker-compose.prod.yml to set VITE_API_BASE_URL="" and remove ports.

  caddy:
    build:
      context: .
      dockerfile: docker/caddy/Dockerfile
    restart: unless-stopped
    profiles:
      - prod
    ports:
      - "80:80"
      - "443:443"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      BASIC_AUTH_USER: ${BASIC_AUTH_USER?BASIC_AUTH_USER required for prod}
      BASIC_AUTH_HASH: ${BASIC_AUTH_HASH?BASIC_AUTH_HASH required for prod}
      DOMAIN: ${DOMAIN:-}
    env_file:
      - .env
    depends_on:
      - backend
      - frontend
    # Proxies / → frontend, /api/* → backend; basic auth on all routes. TLS if DOMAIN set.
