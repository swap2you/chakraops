# R57 — SPA static + /api reverse proxy (no public raw FastAPI on host).
# Upstream service name "api" matches deploy/docker-compose.prod.yml.

server {
    listen 80;
    server_name _;

    # R70-DEF-003: baseline security headers (edge). HSTS belongs at TLS terminator
    # (Cloudflare/Access); do not set HSTS on plain :80 here.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'" always;

    root /usr/share/nginx/html;
    index index.html;

    # FastAPI via internal compose network only
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Optional direct health probe path (same upstream)
    location = /healthz {
        proxy_pass http://api:8000/api/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
