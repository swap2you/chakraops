# R57 — SPA static + /api reverse proxy (no public raw FastAPI on host).
# Upstream service name "api" matches deploy/docker-compose.prod.yml.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # FastAPI via internal compose network only
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Optional direct health probe path (same upstream)
    location = /healthz {
        proxy_pass http://api:8000/api/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
