# R40 Threshold Registry — provenance overlay for strategy_profiles.yaml
#
# Runtime decisioning STILL reads config/strategy_profiles.yaml (unchanged).
# This registry documents whether each key is inherited (from profiles, no
# R40 calibration evidence yet) or calibrated (requires evidence_path).
#
# Profile mapping:
#   conservative | balanced | aggressive  — built-in profiles from strategy_profiles.yaml
#   custom                                — derived from balanced + operator overrides at load time
#                                           (not listed as calibrated keys here; overrides are
#                                           operator-supplied and still inherit baseline provenance)
#
# No production threshold retune without evidence. All keys below are
# source: inherited with evidence_path: null until a future calibration release.

version: 1
runtime_source: strategy_profiles.yaml
registry_role: provenance_overlay
notes: >
  R40 introduces this registry so operators can see inherited vs calibrated.
  Values are not duplicated here; look up numbers in strategy_profiles.yaml.
  Changing a key to source: calibrated requires a non-null evidence_path and
  an accepted walk-forward / OOS packet — do not retune in place without that.

